; ───────────────────────────────────────────────────────────────────
; Dialplan for the Bullseye Webex Calling sidecar.
;
; The ARI Originate call lands on bullseye-landing,s — it answers the
; leg, holds for a randomized 35-55 seconds, then hangs up. That gives
; the agent time to observe the "Up" state via ARI before teardown, and
; the randomized hold keeps the call from looking like automated traffic
; to the very spam filters we are measuring.
; ───────────────────────────────────────────────────────────────────

[bullseye-landing]
exten => s,1,Answer()
 same => n,Set(HOLD=${RAND(35,55)})
 same => n,Wait(${HOLD})
 same => n,Hangup()

; Inbound from Webex — someone dialled one of the test numbers. We are
; not a phone; hang up cleanly so the caller gets a fast busy instead
; of endless ringing.
[from-webex]
exten => _X.,1,Hangup()
exten => _+X.,1,Hangup()
exten => s,1,Hangup()
