services:
  bullseye-agent:
    build: .
    image: bullseye-agent:latest
    container_name: bullseye-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # When the RC sidecar is running in Docker, reach it by service name.
      # Overridden only if RINGCENTRAL_SIDECAR_URL is NOT already set in .env.
      - RINGCENTRAL_SIDECAR_URL=http://ringcentral-sidecar:3000
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # RingCentral SIP sidecar — only starts when using the "ringcentral" profile.
  # Usage: docker compose --profile ringcentral up -d --build
  ringcentral-sidecar:
    build: ./ringcentral-sidecar
    container_name: bullseye-rc-sidecar
    restart: unless-stopped
    profiles: ["ringcentral"]
    env_file:
      - .env
    environment:
      # The agent reaches the sidecar over Docker's private network by
      # service name, so the sidecar must listen on all interfaces (not
      # just loopback). Because this is non-loopback, the sidecar REQUIRES
      # SIDECAR_AUTH_TOKEN — set it in .env; it flows to both containers
      # via env_file above, so they share the same secret. Only the
      # containers on this Compose network can reach 3000 (expose, not
      # ports), and the token gates every call-placing request.
      - SIDECAR_BIND=0.0.0.0
    expose:
      - "3000"
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
